
name: Build UltraScale Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile UltraScale APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/ultrascale/mobile

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "UltraScale"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ultrascale.mobile"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ultrascale.mobile"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.media3:media3-common:1.5.1")
              implementation("androidx.media3:media3-transformer:1.5.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="UltraScale"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ultrascale/mobile/MainActivity.kt <<'EOF'
          package com.ultrascale.mobile

          import android.content.ContentValues
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.media3.common.MediaItem
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import java.io.File
          import java.io.FileInputStream

          class MainActivity : ComponentActivity() {

              private lateinit var status: TextView
              private lateinit var chooseButton: Button
              private lateinit var exportButton: Button

              private var selectedVideo: Uri? = null
              private var transformer: Transformer? = null

              private val videoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.GetContent()
                  ) { uri: Uri? ->
                      selectedVideo = uri

                      if (uri != null) {
                          status.text = "Vidéo sélectionnée !\nPrête à exporter."
                          exportButton.isEnabled = true
                      } else {
                          status.text = "Aucune vidéo sélectionnée."
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = android.graphics.Color.rgb(12, 15, 25)
                  window.navigationBarColor = android.graphics.Color.rgb(12, 15, 25)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(26, 32, 26, 32)
                      setBackgroundColor(android.graphics.Color.rgb(12, 15, 25))
                  }

                  fun makeText(
                      value: String,
                      size: Float,
                      color: Int
                  ): TextView {
                      return TextView(this).apply {
                          text = value
                          textSize = size
                          gravity = Gravity.CENTER
                          setTextColor(color)
                      }
                  }

                  val title = makeText(
                      "ULTRASCALE",
                      30f,
                      android.graphics.Color.WHITE
                  )

                  val subtitle = makeText(
                      "VIDEO STUDIO",
                      13f,
                      android.graphics.Color.rgb(80, 205, 255)
                  )

                  status = makeText(
                      "Choisis une vidéo pour commencer.",
                      16f,
                      android.graphics.Color.LTGRAY
                  )

                  chooseButton = Button(this).apply {
                      text = "CHOISIR UNE VIDÉO"
                      setOnClickListener {
                          videoPicker.launch("video/*")
                      }
                  }

                  exportButton = Button(this).apply {
                      text = "EXPORTER DANS LA GALERIE"
                      isEnabled = false
                      setOnClickListener {
                          startExport()
                      }
                  }

                  val note = makeText(
                      "Export vidéo local\n" +
                      "Enregistrement dans Movies/UltraScale\n" +
                      "IA et interpolation 60 FPS non intégrées.",
                      12f,
                      android.graphics.Color.LTGRAY
                  )

                  listOf(
                      title,
                      subtitle,
                      status,
                      chooseButton,
                      exportButton,
                      note
                  ).forEach { view ->
                      root.addView(
                          view,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              bottomMargin = 12
                          }
                      )
                  }

                  setContentView(root)
              }

              private fun startExport() {
                  val source = selectedVideo ?: return

                  chooseButton.isEnabled = false
                  exportButton.isEnabled = false
                  status.text = "Export en cours…\nGarde l'application ouverte."

                  val outputFile = File(
                      cacheDir,
                      "ultrascale_${System.currentTimeMillis()}.mp4"
                  )

                  val listener = object : Transformer.Listener {

                      override fun onCompleted(
                          composition: androidx.media3.transformer.Composition,
                          exportResult: ExportResult
                      ) {
                          Thread {
                              try {
                                  saveToGallery(outputFile)

                                  runOnUiThread {
                                      status.text =
                                          "Export terminé !\n" +
                                          "Vidéo enregistrée dans Movies/UltraScale."
                                      chooseButton.isEnabled = true
                                      exportButton.isEnabled = true
                                  }
                              } catch (e: Exception) {
                                  runOnUiThread {
                                      status.text =
                                          "Export effectué, mais sauvegarde impossible :\n" +
                                          (e.localizedMessage ?: "Erreur inconnue")
                                      chooseButton.isEnabled = true
                                      exportButton.isEnabled = true
                                  }
                              } finally {
                                  outputFile.delete()
                              }
                          }.start()
                      }

                      override fun onError(
                          composition: androidx.media3.transformer.Composition,
                          exportResult: ExportResult,
                          exportException: ExportException
                      ) {
                          runOnUiThread {
                              status.text =
                                  "Échec de l'export :\n" +
                                  (exportException.localizedMessage ?: "Erreur inconnue")
                              chooseButton.isEnabled = true
                              exportButton.isEnabled = true
                          }
                      }
                  }

                  try {
                      val editedItem = EditedMediaItem.Builder(
                          MediaItem.fromUri(source)
                      ).build()

                      transformer = Transformer.Builder(this)
                          .addListener(listener)
                          .build()

                      transformer?.start(editedItem, outputFile.absolutePath)
                  } catch (e: Exception) {
                      status.text =
                          "Impossible de démarrer l'export :\n" +
                          (e.localizedMessage ?: "Erreur inconnue")
                      chooseButton.isEnabled = true
                      exportButton.isEnabled = true
                  }
              }

              private fun saveToGallery(file: File) {
                  val values = ContentValues().apply {
                      put(
                          MediaStore.Video.Media.DISPLAY_NAME,
                          "UltraScale_${System.currentTimeMillis()}.mp4"
                      )
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          put(
                              MediaStore.Video.Media.RELATIVE_PATH,
                              "Movies/UltraScale"
                          )
                          put(MediaStore.Video.Media.IS_PENDING, 1)
                      }
                  }

                  val uri = contentResolver.insert(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      values
                  ) ?: error("Android n'a pas pu créer le fichier dans la galerie.")

                  try {
                      val output = contentResolver.openOutputStream(uri)
                          ?: error("Impossible d'ouvrir le fichier de destination.")

                      output.use { destination ->
                          FileInputStream(file).use { input ->
                              input.copyTo(destination)
                          }
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val ready = ContentValues().apply {
                              put(MediaStore.Video.Media.IS_PENDING, 0)
                          }
                          contentResolver.update(uri, ready, null, null)
                      }
                  } catch (e: Exception) {
                      contentResolver.delete(uri, null, null)
                      throw e
                  }
              }
          }
          EOF

      - name: Compile APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraScale-Android-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
