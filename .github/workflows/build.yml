
name: Build UltraScale Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Générer le projet Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/ultrascale/mobile
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraScale"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ultrascale.mobile"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ultrascale.mobile"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.media3:media3-common:1.5.1")
              implementation("androidx.media3:media3-transformer:1.5.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="UltraScale"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ultrascale/mobile/MainActivity.kt <<'EOF'
          package com.ultrascale.mobile

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.net.Uri
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.media3.common.MediaItem
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import java.io.File

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var exportButton: Button
              private var selectedVideo: Uri? = null
              private var transformer: Transformer? = null

              private val picker =
                  registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                      if (uri != null) {
                          selectedVideo = uri
                          status.text = "Vidéo sélectionnée ✓\nPrête pour l'export."
                          exportButton.isEnabled = true
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(12, 15, 25)
                  window.navigationBarColor = Color.rgb(12, 15, 25)
                  window.decorView.systemUiVisibility = 0

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 32, 28, 32)
                      setBackgroundColor(Color.rgb(12, 15, 25))
                  }

                  val title = TextView(this).apply {
                      text = "ULTRASCALE"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text = "VIDEO STUDIO  •  ANDROID"
                      textSize = 12f
                      setTextColor(Color.rgb(100, 210, 255))
                      gravity = Gravity.CENTER
                  }

                  status = TextView(this).apply {
                      text = "Donne une seconde vie à tes vidéos.\n\nChoisis une vidéo pour commencer."
                      textSize = 16f
                      setTextColor(Color.rgb(220, 225, 240))
                      gravity = Gravity.CENTER
                      setPadding(0, 36, 0, 36)
                  }

                  val chooseButton = Button(this).apply {
                      text = "CHOISIR UNE VIDÉO"
                      setOnClickListener { picker.launch("video/*") }
                  }

                  exportButton = Button(this).apply {
                      text = "EXPORTER LA VIDÉO"
                      isEnabled = false
                      setOnClickListener { exportVideo() }
                  }

                  val note = TextView(this).apply {
                      text = "Version 1.0 • Traitement local\nL'amélioration IA avancée sera ajoutée dans une prochaine version."
                      textSize = 12f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 28, 0, 0)
                  }

                  root.addView(title, match())
                  root.addView(subtitle, match())
                  root.addView(status, match())
                  root.addView(chooseButton, match())
                  root.addView(exportButton, match())
                  root.addView(note, match())
                  setContentView(root)
              }

              private fun match(): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = 12 }

              private fun exportVideo() {
                  val uri = selectedVideo ?: return
                  exportButton.isEnabled = false
                  status.text = "Préparation de l'export…"

                  val output = File(cacheDir, "UltraScale_${System.currentTimeMillis()}.mp4")
                  val item = EditedMediaItem.Builder(MediaItem.fromUri(uri)).build()

                  val listener = object : Transformer.Listener {
                      override fun onCompleted(
                          composition: androidx.media3.transformer.Composition,
                          exportResult: ExportResult
                      ) {
                          runOnUiThread {
                              status.text = "Export terminé ✓\nFichier : ${output.name}\nEmplacement temporaire de l'application."
                              Toast.makeText(
                                  this@MainActivity,
                                  "Export terminé",
                                  Toast.LENGTH_LONG
                              ).show()
                              exportButton.isEnabled = true
                          }
                      }

                      override fun onError(
                          composition: androidx.media3.transformer.Composition,
                          exportResult: ExportResult,
                          exportException: ExportException
                      ) {
                          runOnUiThread {
                              status.text = "Échec de l'export.\nEssaie avec une autre vidéo."
                              exportButton.isEnabled = true
                          }
                      }
                  }

                  try {
                      transformer = Transformer.Builder(this)
                          .addListener(listener)
                          .build()
                      transformer?.start(item, output.absolutePath)
                  } catch (e: Exception) {
                      status.text = "Impossible de démarrer l'export : ${e.message}"
                      exportButton.isEnabled = true
                  }
              }
          }
          EOF

      - name: Compiler l'APK
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraScale-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
