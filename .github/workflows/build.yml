
name: Build UltraScale Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/ultrascale/mobile

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "UltraScale"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ultrascale.mobile"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ultrascale.mobile"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.media3:media3-common:1.5.1")
              implementation("androidx.media3:media3-transformer:1.5.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="UltraScale"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ultrascale/mobile/MainActivity.kt <<'EOF'
          package com.ultrascale.mobile

          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.media3.common.MediaItem
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import java.io.File

          class MainActivity : ComponentActivity() {

              private lateinit var status: TextView
              private lateinit var chooseButton: Button
              private lateinit var exportButton: Button
              private var selectedVideo: Uri? = null
              private var transformer: Transformer? = null

              private val videoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.GetContent()
                  ) { uri: Uri? ->
                      selectedVideo = uri
                      if (uri != null) {
                          status.text = "Vidéo sélectionnée !\nPrête pour l'export."
                          exportButton.isEnabled = true
                      } else {
                          status.text = "Aucune vidéo sélectionnée."
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(12, 15, 25)
                  window.navigationBarColor = Color.rgb(12, 15, 25)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 32, 28, 32)
                      setBackgroundColor(Color.rgb(12, 15, 25))
                  }

                  val title = TextView(this).apply {
                      text = "ULTRASCALE"
                      textSize = 30f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                  }

                  val subtitle = TextView(this).apply {
                      text = "VIDEO STUDIO"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(80, 205, 255))
                  }

                  status = TextView(this).apply {
                      text = "Donne une nouvelle vie à tes vidéos.\n\nSélectionne une vidéo pour commencer."
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(225, 230, 240))
                      setPadding(0, 32, 0, 32)
                  }

                  chooseButton = Button(this).apply {
                      text = "CHOISIR UNE VIDÉO"
                      setOnClickListener {
                          videoPicker.launch("video/*")
                      }
                  }

                  exportButton = Button(this).apply {
                      text = "EXPORTER LA VIDÉO"
                      isEnabled = false
                      setOnClickListener {
                          exportVideo()
                      }
                  }

                  val note = TextView(this).apply {
                      text = "Traitement local • Version 1.0\nL'amélioration IA sera ajoutée ensuite."
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 24, 0, 0)
                  }

                  listOf(title, subtitle, status, chooseButton, exportButton, note)
                      .forEach { view ->
                          root.addView(
                              view,
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  bottomMargin = 12
                              }
                          )
                      }

                  setContentView(root)
              }

              private fun exportVideo() {
                  val input = selectedVideo ?: return
                  val output = File(
                      getExternalFilesDir(null) ?: cacheDir,
                      "UltraScale_${System.currentTimeMillis()}.mp4"
                  )

                  chooseButton.isEnabled = false
                  exportButton.isEnabled = false
                  status.text = "Export en cours…\nGarde l'application ouverte."

                  val listener = object : Transformer.Listener {

                      override fun onCompleted(
                          composition: androidx.media3.transformer.Composition,
                          exportResult: ExportResult
                      ) {
                          runOnUiThread {
                              status.text =
                                  "Export terminé !\nFichier : ${output.name}\nEnregistré dans l'espace de l'application."
                              chooseButton.isEnabled = true
                              exportButton.isEnabled = true
                              Toast.makeText(
                                  this@MainActivity,
                                  "Vidéo exportée",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }

                      override fun onError(
                          composition: androidx.media3.transformer.Composition,
                          exportResult: ExportResult,
                          exportException: ExportException
                      ) {
                          runOnUiThread {
                              status.text =
                                  "Échec de l'export.\nEssaie avec une autre vidéo."
                              chooseButton.isEnabled = true
                              exportButton.isEnabled = true
                          }
                      }
                  }

                  try {
                      val editedItem = EditedMediaItem.Builder(
                          MediaItem.fromUri(input)
                      ).build()

                      transformer = Transformer.Builder(this)
                          .addListener(listener)
                          .build()

                      transformer?.start(editedItem, output.absolutePath)
                  } catch (e: Exception) {
                      status.text = "Erreur : ${e.localizedMessage ?: "export impossible"}"
                      chooseButton.isEnabled = true
                      exportButton.isEnabled = true
                  }
              }
          }
          EOF

      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraScale-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
